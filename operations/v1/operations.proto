syntax = "proto3";

package lift.operations.v1;

option go_package = "github.com/graytech-lk/lift-protos/gen/go/operations/v1;operationsv1";

// Generic querying API for the `service_requests` collection in lift-operations-service.
//
// NOTE:
// - `filter_json`, `projection_json`, and `sort_json` are expected to be valid
//   MongoDB Extended JSON (relaxed mode is accepted by the server).
// - Responses are returned as MongoDB Extended JSON documents.

message ListServiceRequestsRequest {
  // MongoDB filter document in JSON (Extended JSON recommended).
  // Example: {"status":"completed","service_provider_ids.rider_id":"<id>"}
  string filter_json = 1;

  // MongoDB projection document in JSON.
  // Example: {"id":1,"service_extended_parameters.start_time":1}
  string projection_json = 2;

  // Optional pagination and sorting.
  int32 limit = 3;
  int32 skip = 4;
  // MongoDB sort document in JSON.
  // Example: {"service_extended_parameters.start_time":-1}
  string sort_json = 5;
}

message ListServiceRequestsResponse {
  // Each entry is a full service request document as Extended JSON.
  repeated string service_requests_json = 1;
}

message CountServiceProviderRecordsRequest {
  // Identity user_id of the service provider (driver or fleet owner).
  string user_id = 1;
}

// How many operations records refer to a service provider. Used by
// lift-identity-service before an admin deletes a driver: any count above
// zero blocks the delete.
message CountServiceProviderRecordsResponse {
  // service_requests in any status that name the service provider as the
  // driver, the requested or excluded driver, the canceller, the fleet owner,
  // the commission payer or the held-settlement credit payer.
  int64 service_requests = 1;
  // sos_incidents the service provider reported or was the trip driver of.
  int64 sos_incidents = 2;
}

service ServiceRequestService {
  rpc ListServiceRequests(ListServiceRequestsRequest) returns (ListServiceRequestsResponse);
  // Counts the records that refer to a service provider (see the response).
  rpc CountServiceProviderRecords(CountServiceProviderRecordsRequest) returns (CountServiceProviderRecordsResponse);
}

message RevokeServiceProviderSessionRequest {
  // Identity user_id of the service provider whose currently-connected device
  // should be told to log out (equals service_provider_ids.rider_id).
  string driver_id = 1;
}

message RevokeServiceProviderSessionResponse {
  // True when a live WebSocket connection received the logout signal. False
  // (with no error) means the driver had no connected device — the token
  // revocation backstop logs them out on their next request regardless.
  bool delivered = 1;
}

// SessionService lets lift-identity-service nudge a service provider's
// currently-connected device to log out immediately, right after its session
// was revoked by a login on another device. This is an immediacy optimisation
// on top of stateful token revocation, not the source of truth.
service SessionService {
  rpc RevokeServiceProviderSession(RevokeServiceProviderSessionRequest) returns (RevokeServiceProviderSessionResponse);
}

