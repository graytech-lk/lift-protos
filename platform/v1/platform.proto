syntax = "proto3";

package lift.platform.v1;

option go_package = "github.com/graytech-lk/lift-protos/gen/go/platform/v1;platformv1";

import "google/protobuf/empty.proto";
import "google/protobuf/struct.proto";

message GetConfigurationByCategoryRequest {
  string category = 1;
}

message Configuration {
  string category = 1;
  google.protobuf.Struct parameters = 2;
}

message GetConfigurationByCategoryResponse {
  Configuration configuration = 1;
}

message GetServiceSubCategoryRequest {
  string service_sub_category_id = 1;
}

message ServiceSubParameters {
  double distance_charge = 1;
  double waiting_charge = 2;
  double waiting_free = 3;
  double boot_space = 4;
  double passenger_count = 5;
  double minimum_charge = 6;
  double peak_time_multiplier = 7;
  double company_rev_share = 8;
  double app_charge = 9;
  double passenger_insurance = 10;
}

message ServiceSubCategory {
  string sub_service_category_id = 1;
  string service_category_id = 2;
  string sub_service_category_name = 3;
  string description = 4;
  bool status = 5;
  string icon_url = 6;
  ServiceSubParameters sub_service_parameters = 7;
  string service_category_name = 8;
  // vehicle_type_id is optional — unset means no vehicle type assigned yet.
  optional int32 vehicle_type_id = 9;
  // vehicle_top_view_image_url is the top-view image URL from the linked vehicle type.
  // Empty string when no vehicle type is assigned.
  optional string vehicle_top_view_image_url = 10;
  // vehicle_side_view_image_url is the side-view image URL from the linked vehicle type.
  // Empty string when no vehicle type is assigned.
  optional string vehicle_side_view_image_url = 11;
  // highway_enabled gates the highway route option for trips under this
  // sub-category (LIFT-1673). When false, operations-service forces
  // avoid_highways regardless of what the client asks for. Additive field —
  // clients on older builds simply ignore it and behave as before.
  bool highway_enabled = 12;
}

message VehicleType {
  int32 id = 1;
  string name = 2;
  bool status = 3;
  string top_view_image_url = 4;
  string side_view_image_url = 5;
}

message ListVehicleTypesRequest {
  bool active_only = 1;
}

message ListVehicleTypesResponse {
  repeated VehicleType vehicle_types = 1;
}

message GetVehicleTypeRequest {
  int32 id = 1;
}

message GetVehicleTypeResponse {
  VehicleType vehicle_type = 1;
}

message CreateVehicleTypeRequest {
  string name = 1;
}

message CreateVehicleTypeResponse {
  VehicleType vehicle_type = 1;
}

message UpdateVehicleTypeRequest {
  int32 id = 1;
  string name = 2;
  bool status = 3;
}

message UpdateVehicleTypeResponse {
  VehicleType vehicle_type = 1;
}

message SetVehicleTypeStatusRequest {
  int32 id = 1;
  bool active = 2;
}

message SetVehicleTypeStatusResponse {
  VehicleType vehicle_type = 1;
}

message GetServiceSubCategoryResponse {
  ServiceSubCategory service_sub_category = 1;
}

message ServiceCategory {
  string service_category_id = 1;
  string service_category_name = 2;
  string description = 3;
  bool status = 4;
  repeated string rating_types = 5;
  string icon_url = 6;
}

message Pagination {
  int32 page_number = 1;
  int32 results_per_page = 2;
  int32 number_of_pages = 3;
  int64 number_of_results = 4;
}

message GetAllServiceCategoriesRequest {
  int32 page_number = 1;
  int32 results_per_page = 2;
  repeated string result_params = 3;
}

message GetAllServiceCategoriesResponse {
  repeated ServiceCategory content = 1;
  Pagination pagination = 2;
}

message GetAllServiceSubCategoriesRequest {
  int32 page_number = 1;
  int32 results_per_page = 2;
  repeated string result_params = 3;
}

message GetAllServiceSubCategoriesResponse {
  repeated ServiceSubCategory content = 1;
  Pagination pagination = 2;
}

message TaxAmounts {
  double vat_amount = 1;
  double sscl_amount = 2;
}

message GetTaxAmountsResponse {
  TaxAmounts tax_amounts = 1;
}

message CustomerAppConfig {
  string id = 1;
  string config_category = 2;
  google.protobuf.Struct properties = 3;
}

message GetCustomerAppConfigByCategoryRequest {
  string config_category = 1;
}

message GetCustomerAppConfigByCategoryResponse {
  CustomerAppConfig config = 1;
}

service ConfigurationService {
  rpc GetConfigurationByCategory(GetConfigurationByCategoryRequest) returns (GetConfigurationByCategoryResponse);
}

service CustomerAppConfigService {
  rpc GetCustomerAppConfigByCategory(GetCustomerAppConfigByCategoryRequest) returns (GetCustomerAppConfigByCategoryResponse);
}

service TaxConfigService {
  rpc GetTaxAmounts(google.protobuf.Empty) returns (GetTaxAmountsResponse);
}

service ServiceCategoryService {
  rpc GetAllServiceCategories(GetAllServiceCategoriesRequest) returns (GetAllServiceCategoriesResponse);
}

service ServiceSubCategoryService {
  rpc GetServiceSubCategory(GetServiceSubCategoryRequest) returns (GetServiceSubCategoryResponse);
  rpc GetAllServiceSubCategories(GetAllServiceSubCategoriesRequest) returns (GetAllServiceSubCategoriesResponse);
}

service VehicleTypeService {
  rpc ListVehicleTypes(ListVehicleTypesRequest) returns (ListVehicleTypesResponse);
  rpc GetVehicleType(GetVehicleTypeRequest) returns (GetVehicleTypeResponse);
  rpc CreateVehicleType(CreateVehicleTypeRequest) returns (CreateVehicleTypeResponse);
  rpc UpdateVehicleType(UpdateVehicleTypeRequest) returns (UpdateVehicleTypeResponse);
  rpc SetVehicleTypeStatus(SetVehicleTypeStatusRequest) returns (SetVehicleTypeStatusResponse);
}

message SmsGatewayConfig {
  string host     = 1;
  string port     = 2;
  string sender   = 3;
  string username = 4;
  string password = 5;
  string timeout  = 6;
}

message GetSmsGatewayConfigRequest {}

message GetSmsGatewayConfigResponse {
  SmsGatewayConfig config = 1;
}

service SmsGatewayConfigService {
  rpc GetSmsGatewayConfig(GetSmsGatewayConfigRequest) returns (GetSmsGatewayConfigResponse);
}

message EmailGatewayConfig {
  string host          = 1;
  string port          = 2;
  string encryption    = 3;  // none, ssl, tls
  bool   auth_required = 4;
  string username      = 5;  // SMTP auth username (falls back to from_email)
  string password      = 6;  // decrypted SMTP password
  string from_email    = 7;
  string from_name     = 8;
  string reply_to      = 9;
}

message GetEmailGatewayConfigRequest {}

message GetEmailGatewayConfigResponse {
  EmailGatewayConfig config = 1;
}

service EmailGatewayConfigService {
  rpc GetEmailGatewayConfig(GetEmailGatewayConfigRequest) returns (GetEmailGatewayConfigResponse);
}

message GetOtpSettingsRequest {}

message OtpSettings {
  int32 otp_length = 1;
  int32 otp_expiry_minutes = 2;
  int32 otp_resend_cooldown_seconds = 3;
  int32 max_otp_attempts = 4;
  string otp_delivery_method = 5;  // sms_only, email_only, sms_and_email
  bool otp_numeric_only = 6;
}

message GetOtpSettingsResponse {
  OtpSettings settings = 1;
}

message GetSecurityConfigRequest {
  string config_key = 1;  // session_settings, admin_security
}

message SessionSettings {
  int32 max_concurrent_sessions_driver = 1;
  int32 max_concurrent_sessions_customer = 2;
  int32 admin_session_timeout_minutes = 3;
}

message AdminSecuritySettings {
  int32 max_failed_login_attempts = 1;
  int32 admin_lockout_duration_minutes = 2;
  bool lockout_notification_enabled = 3;
}

message SecurityConfigResponse {
  google.protobuf.Struct config = 1;
}

service OtpConfigService {
  rpc GetOtpSettings(GetOtpSettingsRequest) returns (GetOtpSettingsResponse);
}

service SecurityConfigService {
  rpc GetSecurityConfig(GetSecurityConfigRequest) returns (SecurityConfigResponse);
}
