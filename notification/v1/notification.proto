syntax = "proto3";

package lift.notification.v1;

// Centralised notification proto used by lift-identity-service and
// lift-notification-service.
//
// Generated Go code is published under:
//   github.com/graytech-lk/lift-protos/gen/go/notification/v1
option go_package = "github.com/graytech-lk/lift-protos/gen/go/notification/v1;notificationv1";

message SendOTPRequest {
  string channel = 1;       // e.g. "email", "sms"
  string recipient = 2;
  string template = 3;      // template identifier
  string purpose = 4;       // e.g. "login_otp"
  string locale = 5;        // default "en"
  string correlation_id = 6;
  int32 ttl_seconds = 7;
  map<string, string> data = 8; // {"code":"123456", ...}
}

message SendOTPResponse {}

// SendSmsRequest is used for templated SMS (e.g. friend ride tracking).
// Common SMS method called by lift-operations-service and others.
message SendSmsRequest {
  string phone_number = 1;
  string template = 2;
  map<string, string> template_data = 3;
}

message SendSmsResponse {}

// SendTestEmailRequest carries candidate (possibly unsaved) SMTP settings used
// to send a one-off test email from the admin panel. The notification-service
// owns the actual SMTP send so credentials never leave the gRPC channel.
message SendTestEmailRequest {
  string recipient     = 1;
  string host          = 2;
  string port          = 3;
  string encryption    = 4;  // none, ssl, tls
  bool   auth_required = 5;
  string smtp_username = 6;
  string password      = 7;
  string from_email    = 8;
  string from_name     = 9;
  string reply_to      = 10;
}

message SendTestEmailResponse {
  bool   sent  = 1;
  string error = 2;
}

service NotificationService {
  rpc SendOTP(SendOTPRequest) returns (SendOTPResponse);
  rpc SendSms(SendSmsRequest) returns (SendSmsResponse);
  rpc SendTestEmail(SendTestEmailRequest) returns (SendTestEmailResponse);
}


