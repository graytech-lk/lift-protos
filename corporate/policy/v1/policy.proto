syntax = "proto3";

package lift.corporate.policy.v1;

option go_package = "github.com/graytech-lk/lift-protos/gen/go/corporate/policy/v1;corporatepolicyv1";

import "google/protobuf/timestamp.proto";

message GetCorporatePolicyByIdRequest {
  string id = 1;
}

message CorporatePolicySubLimitation {
  int32 per_trip = 1;
  int32 per_day = 2;
  int32 per_week = 3;
  int32 per_month = 4;
}

message PolicyLocation {
  string name = 1;
  double lat = 2;
  double lng = 3;
}

message CorporatePolicyLimitation {
  repeated string sub_category_uuids = 1;
  string start_time = 2;
  string day_of_week = 3;
  string date_of_month = 4;
  repeated string start_locations = 5;
  repeated string end_locations = 6;
  CorporatePolicySubLimitation distance_limitation = 7;
  CorporatePolicySubLimitation cost_limitation = 8;
  CorporatePolicySubLimitation service_count_limitation = 9;
  repeated PolicyLocation start_locations_v2 = 10;
  repeated PolicyLocation end_locations_v2 = 11;
}

message CorporatePolicy {
  string id = 1;
  string corporate_id = 2;
  google.protobuf.Timestamp created_time = 3;
  google.protobuf.Timestamp updated_time = 4;
  string name = 5;
  string description = 6;
  map<string, CorporatePolicyLimitation> limitations = 7;
}

message GetCorporatePolicyByIdResponse {
  CorporatePolicy policy = 1;
}

message ValidateServiceRequestWithPolicyRequest {
  string policy_id = 1;
  string service_category_id = 2;
  string service_sub_category_id = 3;
  google.protobuf.Timestamp request_time = 4;
  string start_location = 5;
  repeated string destination_locations = 6;
  PolicyLocation start_location_v2 = 7;
  repeated PolicyLocation destination_locations_v2 = 8;
  // Estimated fare + distance of THIS trip, for per-trip cost/distance limits.
  // Zero = not provided (older callers) → the per-trip check is skipped.
  double estimated_cost = 9;
  double estimated_distance = 10;
  // Booking user + corporate, for cumulative per-day/week/month limits.
  // Empty = not provided → cumulative checks are skipped.
  string user_id = 11;
  string corporate_id = 12;
}

message ValidateServiceRequestWithPolicyResponse {
  bool allowed = 1;
  string reason = 2;
}

// Why ValidateServiceRequestWithPolicy refused the request. Attached as a
// gRPC status detail on the PermissionDenied error, so a caller that doesn't
// read details still gets the legacy reason text in the status message, and
// one that does can tell the customer the actual limit (BUG-08 phase 2).
message PolicyDenial {
  // Stable reason the apps branch on: policy_service_category,
  // policy_sub_category, policy_day_of_week, policy_date_of_month,
  // policy_time_window, policy_start_location, policy_end_location,
  // policy_trip_cost, policy_trip_distance, policy_daily_distance,
  // policy_weekly_distance, policy_monthly_distance, policy_daily_spend,
  // policy_weekly_spend, policy_monthly_spend, policy_daily_trips,
  // policy_monthly_trips.
  string code = 1;
  // Legacy reason text, e.g. "restricted trip distance limit exceeded".
  string reason = 2;
  // Distance limit (km) and this trip's estimate, for the distance codes.
  double limit_km = 3;
  double estimated_km = 4;
  // Days the policy allows (Mon..Sun), for policy_day_of_week.
  repeated string allowed_days = 5;
  // Booking window as HH:MM in Sri Lanka time, for policy_time_window.
  string start_time = 6;
  string end_time = 7;
  // Sub-categories the policy allows, for policy_sub_category.
  repeated string allowed_sub_category_ids = 8;
  // Spend limit and trip-count limit, for the cost / trip-count codes.
  double limit_cost = 9;
  int32 limit_trips = 10;
}

// Catalog option for US-017 category limitations (backed by platform DB / gRPC).
message ServiceSubCategoryOption {
  string service_sub_category_id = 1;
  string service_category_id = 2;
  string sub_service_category_name = 3;
}

message ListServiceSubCategoriesRequest {
  // Reserved for future tenant scoping; ignored today (catalog is global per platform).
  string corporate_id = 1;
}

message ListServiceSubCategoriesResponse {
  repeated ServiceSubCategoryOption items = 1;
}

service CorporatePolicyService {
  rpc GetCorporatePolicyById(GetCorporatePolicyByIdRequest) returns (GetCorporatePolicyByIdResponse);
  rpc ValidateServiceRequestWithPolicy(ValidateServiceRequestWithPolicyRequest) returns (ValidateServiceRequestWithPolicyResponse);
  // Aggregates platform ServiceSubCategoryService.GetAllServiceSubCategories (all pages).
  rpc ListServiceSubCategories(ListServiceSubCategoriesRequest) returns (ListServiceSubCategoriesResponse);
}

