syntax = "proto3";

package lift.corporate.account.v1;

option go_package = "github.com/graytech-lk/lift-protos/gen/go/corporate/account/v1;corporateaccountv1";

import "google/protobuf/timestamp.proto";

message GetCorporateAccountByIdRequest {
  string id = 1;
}

message CorporateAccountDetails {
  string physical_address = 1;
  string company_phone_number = 2;
  string company_email = 3;
  string company_website = 4;
  string service_request_letter_url = 5;
  string business_registration_url = 6;
  string tax_reg_number = 7;
  string form20_url = 8;
  string form48_url = 9;
  string form40_url = 10;
}

message CorporateBankDetails {
  string bank_name = 1;
  string bank_account_number = 2;
}

message CorporateTheme {
  string primary_color = 1;
  string secondary_color = 2;
  string background_color = 3;
  string header_color = 4;
  string text_color = 5;
}

message CorporateAccount {
  string id = 1;
  google.protobuf.Timestamp created_time = 2;
  google.protobuf.Timestamp updated_time = 3;
  string name = 4;
  CorporateAccountDetails details = 5;
  CorporateBankDetails bank_details = 6;
  bool tax_enabled = 7;
  string status = 8;
  double current_credit_amount = 9;
  double credit_limit = 10;
  double temporary_credit_releif = 11;
  string invoice_period = 12;
  double credit_limit_warning_level = 13;
  double credit_limit_critical_level = 14;
  string notification_types = 15;
  string logo_url = 16;
  CorporateTheme color_theme = 17;
}

message GetCorporateAccountByIdResponse {
  CorporateAccount account = 1;
}

message ApplyCorporateChargeRequest {
  // Corporate account id.
  string id = 1;
  // Amount to add to current_credit_amount (must be > 0).
  double amount = 2;
  // Optional reference id (e.g. service_request_id) for audit trails.
  string reference_id = 3;
  // Optional description.
  string description = 4;
}

message ApplyCorporateChargeResponse {
  CorporateAccount account = 1;
}

// ── LIFT-2107: credit holds ─────────────────────────────────────────────
//
// A corporate trip holds credit when it is booked (its fare estimate plus a
// configured buffer), is charged its final fare from that hold when it ends,
// and releases the hold if it never happens. A company can only book while
// used + held + the new hold fits within its credit limit plus any active
// temporary credit relief.

// CorporateCreditPosition is a company's credit at one moment.
message CorporateCreditPosition {
  double credit_limit = 1;
  // Charged in the current billing period.
  double used = 2;
  // Held for trips booked but not yet charged.
  double held = 3;
  // Active temporary credit relief; 0 when none is active.
  double relief = 4;
  // credit_limit + relief - used - held, never below 0.
  double available = 5;
  // How far used + held is past credit_limit + relief; 0 when within.
  double over_limit = 6;
}

message HoldCorporateCreditRequest {
  string corporate_id = 1;
  // The trip the hold is for. A trip has one hold: calling again with a new
  // estimate resizes it.
  string service_request_id = 2;
  // The server's fare estimate. The hold adds the configured buffer to it.
  double estimated_fare = 3;
}

message HoldCorporateCreditResponse {
  // False when the hold doesn't fit the company's credit, or the account
  // can't book; nothing is held then.
  bool allowed = 1;
  // Why it was refused: "insufficient_credit" or "account_inactive".
  // Empty when allowed.
  string reason = 2;
  // What is held, or would be held, for this trip.
  double hold_amount = 3;
  // The company's credit after this call.
  CorporateCreditPosition position = 4;
  // "off", "shadow" or "on". Off holds nothing. Shadow holds but never
  // refuses: allowed is true and would_refuse says what "on" would do.
  string enforcement = 5;
  bool would_refuse = 6;
}

message ReleaseCorporateCreditHoldRequest {
  string service_request_id = 1;
  // Why: e.g. "cancelled", "fall_out", "payment_method_changed", "cleanup".
  string reason = 2;
}

message ReleaseCorporateCreditHoldResponse {
  // False when the trip had no open hold (none, or already charged or
  // released).
  bool released = 1;
  double amount = 2;
}

message ChargeCorporateTripRequest {
  string corporate_id = 1;
  string service_request_id = 2;
  // The trip's final fare (must be > 0). Charged in full even past the
  // company's credit; any hold is closed.
  double amount = 3;
  string description = 4;
}

message ChargeCorporateTripResponse {
  // True when the trip had already been charged; nothing changed.
  bool already_charged = 1;
  double charged = 2;
  CorporateCreditPosition position = 3;
}

service CorporateAccountService {
  rpc GetCorporateAccountById(GetCorporateAccountByIdRequest) returns (GetCorporateAccountByIdResponse);
  // Deprecated: use ChargeCorporateTrip, which can't charge a trip twice.
  rpc ApplyCorporateCharge(ApplyCorporateChargeRequest) returns (ApplyCorporateChargeResponse);
  rpc HoldCorporateCredit(HoldCorporateCreditRequest) returns (HoldCorporateCreditResponse);
  rpc ReleaseCorporateCreditHold(ReleaseCorporateCreditHoldRequest) returns (ReleaseCorporateCreditHoldResponse);
  rpc ChargeCorporateTrip(ChargeCorporateTripRequest) returns (ChargeCorporateTripResponse);
}


