syntax = "proto3";

package lift.payment.v1;

option go_package = "github.com/graytech-lk/lift-protos/gen/go/payment/v1;paymentv1";

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

message UserPaymentMethod {
  string id = 1;
  google.protobuf.Timestamp created_time = 2;
  google.protobuf.Timestamp updated_time = 3;
  string user_id = 4;
  string type = 5;
  string name = 6;
  string payment_method = 7;
  bool is_default = 8;
  google.protobuf.Struct extended_parameters = 9;
  int32 status = 10;
}

message ListUserPaymentMethodsRequest {
  string user_id = 1;
}

message ListUserPaymentMethodsResponse {
  repeated UserPaymentMethod methods = 1;
}

message GetPaymentMethodRequest {
  string user_id = 1;
  string payment_method_id = 2;
}

message GetPaymentMethodResponse {
  UserPaymentMethod method = 1;
}

message GetCorporatePaymentMethodRequest {
  string user_id = 1;
  string corporate_id = 2;
}

message GetCorporatePaymentMethodResponse {
  UserPaymentMethod method = 1;
}

message ListCorporatePaymentMethodsRequest {
  string corporate_id = 1;
  bool include_disabled = 2;
}

message ListCorporatePaymentMethodsResponse {
  repeated UserPaymentMethod methods = 1;
}

message UpdatePaymentMethodStatusRequest {
  string id = 1;
  int32 status = 2;
}

message UpdatePaymentMethodStatusResponse {
  UserPaymentMethod method = 1;
}

message UpdateUserPaymentMethodRequest {
  string user_type = 1;
  string user_id = 2;
  string user_payment_method_id = 3;
  string name = 4;
}

message UpdateUserPaymentMethodResponse {
  UserPaymentMethod method = 1;
}

message SetDefaultUserPaymentMethodRequest {
  string user_type = 1;
  string user_id = 2;
  string user_payment_method_id = 3;
}

message SetDefaultUserPaymentMethodResponse {
  UserPaymentMethod method = 1;
}

message DeleteUserPaymentMethodRequest {
  string user_type = 1;
  string user_id = 2;
  string user_payment_method_id = 3;
}

message DeleteUserPaymentMethodResponse {
  string status = 1; // "success"
}

message AddPromoCodeUserPaymentMethodRequest {
  string user_id = 1;
  string promo_code = 2;
}

message AddPromoCodeUserPaymentMethodResponse {
  UserPaymentMethod method = 1;
}

message ConsumePromoCodeUserPaymentMethodRequest {
  // User who owns the promo-code-backed payment method.
  string user_id = 1;
  // The user payment method id (from user_payment_methods.id) to consume.
  string user_payment_method_id = 2;
  // Number of usages to consume. Defaults to 1 if unset/<=0.
  int32 count = 3;
}

message ConsumePromoCodeUserPaymentMethodResponse {
  UserPaymentMethod method = 1;
}

message EnsureDefaultCashUserPaymentMethodRequest {
  string user_id = 1;
}

message EnsureDefaultCashUserPaymentMethodResponse {
  UserPaymentMethod method = 1;
  bool created = 2;
}

message CreateCorporateUserPaymentMethodRequest {
  string user_id = 1;
  string name = 2;
  string payment_method = 3;
  bool is_default = 4;
  google.protobuf.Struct extended_parameters = 5;
}

message CreateCorporateUserPaymentMethodResponse {
  UserPaymentMethod method = 1;
}

message PaymentMethodConfig {
  string id = 1;
  string name = 2;
}

message GetPaymentMethodByNameRequest {
  string name = 1;
}

message GetPaymentMethodByNameResponse {
  PaymentMethodConfig payment_method = 1;
}

message Payment {
  string id = 1;
  string payment_type = 2;
  string user_payment_method = 3;
  string service_request_id = 4;
  double total_amount_after_discount = 5;
  google.protobuf.Timestamp created_time = 6;
  double total_amount_before_discount = 7;
  google.protobuf.Timestamp updated_time = 8;
  repeated PaymentEvent payment_events = 9;
  // Ride card orchestration (lift-payment-service Mongo; optional on older records).
  string gateway_transaction_id = 10;
  string payment_status = 11;
  double authorized_amount = 12;
  double captured_amount = 13;
  double reversed_amount = 14;
  string trx_comment = 15;
}

message PaymentEvent {
  string id = 1;
  string payment_type = 2;
  string payment_id = 3;
  double amount = 4;
  // Ledger direction: "debit" | "credit" (fare lines, corrections, and card holds/charges).
  string event_type = 5;
  google.protobuf.Timestamp created_time = 6;
  google.protobuf.Timestamp updated_time = 7;
  string gateway_reference_id = 8;
  string gateway_processed_status = 9;
  // Optional CyberSource / ride lifecycle: "authorization" | "capture" | "reversal". Empty for non-gateway rows.
  string gateway_event_type = 10;
}

message ListPaymentsByMethodRequest {
  repeated string payment_method_ids = 1;
  google.protobuf.Timestamp start_time = 2;
  google.protobuf.Timestamp end_time = 3;
}

message ListPaymentsByMethodResponse {
  repeated Payment payments = 1;
}

message InsertPaymentRequest {
  string service_request_id = 1;
  string user_payment_method = 2;
  string payment_type = 3;
  double total_amount_before_discount = 4;
  double total_amount_after_discount = 5;
  repeated PaymentEvent payment_events = 6;
}

message InsertPaymentResponse {
  Payment payment = 1;
}

message GetPaymentByServiceRequestIDRequest {
  string service_request_id = 1;
}

message GetPaymentByServiceRequestIDResponse {
  Payment payment = 1;
}

message FinalizePaymentRequest {
  // Payment being finalized.
  string service_request_id = 1;
  string payment_id = 2;

  // Final totals (after end_hire calculation).
  double total_amount_before_discount = 3;
  double total_amount_after_discount = 4;

  // New events to append (waiting, other charges, correction/refund, etc.).
  repeated PaymentEvent payment_events = 5;
}

message FinalizePaymentResponse {
  Payment payment = 1;
}

// RidePaymentAuthorize places a card authorization hold for a service request (S2S from operations).
message RidePaymentAuthorizeRequest {
  string service_request_id = 1;
  string user_payment_method_id = 2;
  double amount = 3;
}

message RidePaymentAuthorizeResponse {
  Payment payment = 1;
}

// RidePaymentCapture settles the final fare against a prior authorization.
message RidePaymentCaptureRequest {
  string service_request_id = 1;
  double amount = 2;
}

message RidePaymentCaptureResponse {
  Payment payment = 1;
}

// RidePaymentReverse voids an authorization (cancel / no driver / fall_out).
message RidePaymentReverseRequest {
  string service_request_id = 1;
  double reversed_amount = 2;
  string trx_comment = 3;
}

message RidePaymentReverseResponse {
  Payment payment = 1;
}

// RidePaymentStatus returns orchestration state for a service request payment.
message RidePaymentStatusRequest {
  string service_request_id = 1;
}

message RidePaymentStatusResponse {
  string service_request_id = 1;
  string payment_status = 2;
  string payment_type = 3;
  double authorized_amount = 4;
  double captured_amount = 5;
  string gateway_transaction_id = 6;
  string user_payment_method = 7;
}

message GetServiceRequestRequest {
  string service_request_id = 1;
}

message ServiceRequest {
  string id = 1;
  string status = 2;
}

message GetServiceRequestResponse {
  ServiceRequest request = 1;
}

message PromoCode {
  string id = 1;
  string promo_code = 2;
  string promo_type = 3;
  string promo_element = 4;
  google.protobuf.Timestamp start_time = 5;
  google.protobuf.Timestamp end_time = 6;
  string status = 7;
  string day_of_week = 8;
  string date_of_month = 9;
  string time_range = 10;
  int32 minimum_amount = 11;
  int32 maximum_discount_amount = 12;
  int32 min_utilization_count = 13;
  int32 max_utilization_count = 14;
  string eligibility_criteria = 15;
  string eligibility_eval_period = 16;
  string eligibility_operation = 17;
  int32 eligibility_value = 18;
  string eligible_payment_method = 19;
  double discount_amount = 20;
}

message GetPromoCodeRequest {
  string id = 1;
}

message GetPromoCodeResponse {
  PromoCode promocode = 1;
}

service PaymentMethodService {
  rpc ListUserPaymentMethods(ListUserPaymentMethodsRequest) returns (ListUserPaymentMethodsResponse);
  rpc GetPaymentMethod(GetPaymentMethodRequest) returns (GetPaymentMethodResponse);
  rpc GetCorporatePaymentMethod(GetCorporatePaymentMethodRequest) returns (GetCorporatePaymentMethodResponse);
  rpc ListCorporatePaymentMethods(ListCorporatePaymentMethodsRequest) returns (ListCorporatePaymentMethodsResponse);
  rpc UpdatePaymentMethodStatus(UpdatePaymentMethodStatusRequest) returns (UpdatePaymentMethodStatusResponse);
  rpc UpdateUserPaymentMethod(UpdateUserPaymentMethodRequest) returns (UpdateUserPaymentMethodResponse);
  rpc SetDefaultUserPaymentMethod(SetDefaultUserPaymentMethodRequest) returns (SetDefaultUserPaymentMethodResponse);
  rpc DeleteUserPaymentMethod(DeleteUserPaymentMethodRequest) returns (DeleteUserPaymentMethodResponse);
  rpc AddPromoCodeUserPaymentMethod(AddPromoCodeUserPaymentMethodRequest) returns (AddPromoCodeUserPaymentMethodResponse);
  rpc ConsumePromoCodeUserPaymentMethod(ConsumePromoCodeUserPaymentMethodRequest) returns (ConsumePromoCodeUserPaymentMethodResponse);
  rpc EnsureDefaultCashUserPaymentMethod(EnsureDefaultCashUserPaymentMethodRequest) returns (EnsureDefaultCashUserPaymentMethodResponse);
  rpc GetPaymentMethodByName(GetPaymentMethodByNameRequest) returns (GetPaymentMethodByNameResponse);
  rpc CreateCorporateUserPaymentMethod(CreateCorporateUserPaymentMethodRequest) returns (CreateCorporateUserPaymentMethodResponse);
}

service PaymentService {
  rpc InsertPayment(InsertPaymentRequest) returns (InsertPaymentResponse);
  rpc ListPaymentsByMethod(ListPaymentsByMethodRequest) returns (ListPaymentsByMethodResponse);
  rpc GetPaymentByServiceRequestID(GetPaymentByServiceRequestIDRequest) returns (GetPaymentByServiceRequestIDResponse);
  rpc FinalizePayment(FinalizePaymentRequest) returns (FinalizePaymentResponse);
  rpc GetServiceRequest(GetServiceRequestRequest) returns (GetServiceRequestResponse);
  // Ride lifecycle card orchestration (called by lift-operations-service, not mobile clients).
  rpc RidePaymentAuthorize(RidePaymentAuthorizeRequest) returns (RidePaymentAuthorizeResponse);
  rpc RidePaymentCapture(RidePaymentCaptureRequest) returns (RidePaymentCaptureResponse);
  rpc RidePaymentReverse(RidePaymentReverseRequest) returns (RidePaymentReverseResponse);
  rpc RidePaymentStatus(RidePaymentStatusRequest) returns (RidePaymentStatusResponse);
}

service PromoCodeService {
  rpc GetPromoCode(GetPromoCodeRequest) returns (GetPromoCodeResponse);
}


