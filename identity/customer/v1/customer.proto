syntax = "proto3";

package lift.identity.customer.v1;

option go_package = "github.com/graytech-lk/lift-protos/gen/go/identity/customer/v1;customerv1";

import "google/protobuf/timestamp.proto";

message GetCustomerByPhoneRequest {
  string phone_number = 1;
}

message GetCustomerByIdRequest {
  string id = 1;
}

message ListCustomersByIdsRequest {
  repeated string user_ids = 1;
  int64 skip = 2;
  int64 limit = 3;
}

message UserCustomer {
  string id = 1;
  string phone_number = 2;
  string user_level = 3;
  string gender = 4;
  string user_sub_type = 5;
  repeated string payment_methods = 6;
  int32 wallet_amount = 7;
  string first_name = 8;
  string last_name = 9;
  float rating = 10;
  int32 number_of_cancellations = 11;
  string email = 12;
  bool email_verified = 13;
  string profile_pic_url = 14;
  string tac_version = 15;
  string emergency_contact = 16;
  string status = 17;
  google.protobuf.Timestamp created_time = 18;
  google.protobuf.Timestamp updated_time = 19;
  // JSON array of favorite route objects (matches user_customers.favorite_locations).
  string favorite_locations_json = 20;
  // JSON object keyed by service category (matches user_customers.usage_details).
  string usage_details_json = 21;
  string device_type = 22;
  // True when the customer has registered on a mobile app (non-empty device_token).
  bool registered_on_app = 23;
  // Job / role designation (Director, Manager, etc.) — LIFT-927 / FRD corporate user table.
  string job_designation = 24;
}

message GetCustomerByPhoneResponse {
  UserCustomer customer = 1;
}

message GetCustomerByIdResponse {
  UserCustomer customer = 1;
}

message ListCustomersByIdsResponse {
  repeated UserCustomer customers = 1;
  int64 total_count = 2;
}

message AddPaymentMethodToCustomerRequest {
  string customer_id = 1;
  string payment_method_id = 2;
}

message AddPaymentMethodToCustomerResponse {
  // Empty response - success indicated by no error
}

// UpdateCustomerCorporateFieldsRequest patches corporate-admin-editable fields only
// (US-006). Omitted optional fields are left unchanged.
message UpdateCustomerCorporateFieldsRequest {
  string customer_id = 1;
  optional string job_designation = 2;
  optional string status = 3;
  // When false, clears device registration (non–app user). When true, requires an
  // existing device_token or the call fails with FAILED_PRECONDITION.
  optional bool registered_on_app = 4;
}

message UpdateCustomerCorporateFieldsResponse {
  UserCustomer customer = 1;
}

message JobDesignationItem {
  string code = 1;
  string label = 2;
  int32 sort_order = 3;
}

message ListJobDesignationsResponse {
  repeated JobDesignationItem designations = 1;
}

message ListJobDesignationsRequest {}

service CustomerService {
  rpc GetCustomerByPhone(GetCustomerByPhoneRequest) returns (GetCustomerByPhoneResponse);
  rpc GetCustomerById(GetCustomerByIdRequest) returns (GetCustomerByIdResponse);
  rpc ListCustomersByIds(ListCustomersByIdsRequest) returns (ListCustomersByIdsResponse);
  rpc AddPaymentMethodToCustomer(AddPaymentMethodToCustomerRequest) returns (AddPaymentMethodToCustomerResponse);
  rpc UpdateCustomerCorporateFields(UpdateCustomerCorporateFieldsRequest) returns (UpdateCustomerCorporateFieldsResponse);
  // ListJobDesignations returns active rows from reference_job_designations (corporate admin UI).
  rpc ListJobDesignations(ListJobDesignationsRequest) returns (ListJobDesignationsResponse);
}


